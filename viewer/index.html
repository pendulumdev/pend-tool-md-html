<!doctype html>
<html lang="en" data-theme="noon">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Documents</title>
  <script>
    (function () {
      try {
        var m = document.cookie.match(/(?:^|; )mdh-theme=([^;]*)/);
        document.documentElement.dataset.theme =
          m && decodeURIComponent(m[1]) === 'midnight' ? 'midnight' : 'noon';
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1 id="hero-title">Documents</h1>
      <p class="lead" id="hero-lead">Loading…</p>

      <div class="toolbar">
        <button id="refresh" class="btn ghost" hidden>Refresh</button>
        <input id="search" class="search" placeholder="Filter files…" hidden />
        <div class="switch" role="radiogroup" aria-label="Layout">
          <button type="button" class="switch-opt active" data-view="list" role="radio" aria-checked="true">List</button>
          <button type="button" class="switch-opt" data-view="map" role="radio" aria-checked="false">Map</button>
        </div>
        <div class="switch" role="radiogroup" aria-label="Theme">
          <button type="button" class="switch-opt icon-opt active" data-theme="noon" role="radio" aria-checked="true" aria-label="Noon" title="Noon">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="switch-opt icon-opt" data-theme="midnight" role="radio" aria-checked="false" aria-label="Midnight" title="Midnight">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.2 10.6A5.2 5.2 0 0 1 6.1 3.4 5.4 5.4 0 1 0 11.2 10.6z"/></svg>
          </button>
        </div>
        <button type="button" id="reset-state" class="btn ghost compact" title="Clear viewed and read marks">Reset</button>
      </div>

      <div id="status" class="status"><span class="dot"></span><span class="msg">Starting…</span></div>
    </header>

    <main id="main">
      <div id="empty" class="empty">
        <p><strong>Waiting for document index…</strong></p>
        <p style="margin:0;">
          Served by <code>md-html</code> from your project's <code>md-html.toml</code>.
        </p>
      </div>
      <div id="list-root"></div>
      <div id="map-root" class="map-root" hidden></div>
    </main>

    <div class="footer">
      <code>md-html</code> · localhost markdown browser ·
      <a href="https://github.com/pendulumdev/pend-tool-md-html">pendulumdev/pend-tool-md-html</a>
    </div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-bar">
      <button class="btn ghost" id="back-btn" hidden title="Back to previous document">←</button>
      <div class="title" id="modal-title">Document<span class="sub" id="modal-sub"></span></div>
      <button type="button" id="mark-read" class="mark" hidden title="Mark read">Mark read</button>
      <button class="btn" id="edit-btn" hidden>Edit</button>
      <button class="btn primary" id="save-btn" hidden>Save</button>
      <button class="btn ghost" id="cancel-btn" hidden>Cancel</button>
      <button class="btn ghost" id="close-btn" title="Close (Esc)">Close</button>
    </div>
    <div class="modal-body" id="modal-body">
      <article class="modal-content" id="modal-content"></article>
      <div class="editor" id="editor">
        <textarea id="editor-text" spellcheck="false"></textarea>
        <div class="hint"><kbd>⌘S</kbd> / <kbd>Ctrl+S</kbd> to save · <kbd>Esc</kbd> to cancel</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/md.js"></script>
  <script src="/map.js"></script>
  <script src="/app.js"></script>
</body>
</html>
