[package]
name = "md-html"
version = "0.3.1"
edition = "2021"
description = "Browse project markdown as a local HTML viewer"
license = "MIT"
repository = "https://github.com/pendulumdev/pend-tool-md-html"
readme = "README.md"
keywords = ["markdown", "docs", "viewer"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "md-html"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"
toml = "1.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
