# Example `md-html.toml` - copy to a project root or run `md-html init`.
# Paths are relative to the directory that contains this file.

title = "Example"
description = "Browsable index of project Markdown."
port = 4173
bind = "127.0.0.1"
writable = false
open_browser = true
include_html_sites = true

exclude = ["**/target/**", "**/.git/**", "**/node_modules/**"]

# Optional scan caps (defaults shown). Raise only if you accept the memory cost.
# max_indexed_files = 4000
# max_walk_entries = 100000
# max_file_bytes = 2097152

[[roots]]
path = "docs"
label = "Docs"

# [[roots]]
# path = "spec"
# label = "Spec"

# Top-level markdown only (README, ROADMAP, …)
# [[roots]]
# path = "."
# label = "Root"
# recursive = false
